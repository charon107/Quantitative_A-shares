name: 前端构建部署

# 服务器内存小不跑 Node，dist 在 runner 构建后 scp 到服务器（api 直接托管静态文件，
# 无需重启）。前端有改动时手动触发。
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建 dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 清空服务器旧 dist（防哈希资源堆积）
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            rm -rf /root/Quantitative_A-shares/WechatNum/frontend/dist
            mkdir -p /root/Quantitative_A-shares/WechatNum/frontend/dist

      - name: 传 dist 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "frontend/dist/*"
          target: "/root/Quantitative_A-shares/WechatNum/frontend/dist/"
          strip_components: 2
