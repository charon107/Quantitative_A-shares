name: 服务器诊断与重预热

# 一次性运维（2026-07-09 部署收尾）：杀残留旧版 warmup → git pull 重试
# → 从滚动备份恢复基本面等非日线表 → 原子替换 → 重启 api → 轻量预热。
on:
  workflow_dispatch: {}

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 恢复基本面表 + 更新代码 + 重预热
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/Quantitative_A-shares/WechatNum
            export PATH="/root/.local/bin:$PATH"
            export DUCKDB_PATH=/root/Quantitative_A-shares/WechatNum/market.duckdb
            echo "=== 杀残留 warmup(排除本会话自身) ==="
            for p in $(pgrep -f "warmup"); do { [ "$p" != "$$" ] && [ "$p" != "$PPID" ] && kill -9 "$p" 2>/dev/null; } || true; done
            sleep 1
            echo "=== git pull(重试 5 次,TLS 偶发失败) ==="
            ok=""
            for i in 1 2 3 4 5; do git pull --ff-only origin main && ok=1 && break; echo "pull 失败,重试 $i"; sleep 8; done
            [ -n "$ok" ]
            git log -1 --oneline
            echo "=== 从滚动备份恢复基本面等非日线表 ==="
            cp market.duckdb market.duckdb.merge_tmp
            DUCKDB_PATH=backups/market-20260708-205443.duckdb \
              uv run python scripts/merge_keep_tables.py market.duckdb.merge_tmp
            echo "=== 原子替换 + 重启 api ==="
            systemctl stop api
            uv run python -c "from src import db; db.atomic_swap('market.duckdb.merge_tmp')"
            systemctl start api
            echo "=== 清缓存 + 后台预热(新代码看板窗口版) ==="
            uv run python -m src.cache clear
            nohup uv run python deploy/warmup_redis.py > /root/warmup.log 2>&1 &
            echo "warmup 已后台启动 pid=$!"
            free -m | head -2; df -h / | tail -1
