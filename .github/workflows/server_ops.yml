name: 服务器诊断与重预热

# 一次性运维（2026-07-09）：重算逐年选股（DEFAULT_END_YEAR 动态化后补出 2026 年）。
# load_fundamentals.py 传空目录 = 不 upsert 新数据、只用库里现有年报面板重跑选股。
on:
  workflow_dispatch: {}

concurrency:
  group: daily-ingest   # 与每日入库/部署互斥，避免并发 copy2+swap 丢数据
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 更新代码 + 重算选股 + 验证
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -e
            cd /root/Quantitative_A-shares/WechatNum
            export PATH="/root/.local/bin:$PATH"
            export DUCKDB_PATH=/root/Quantitative_A-shares/WechatNum/market.duckdb
            echo "=== git pull(重试 5 次) ==="
            ok=""
            for i in 1 2 3 4 5; do git pull --ff-only origin main && ok=1 && break; echo "pull 失败,重试 $i"; sleep 8; done
            [ -n "$ok" ]
            git log -1 --oneline
            echo "=== 重算逐年选股(空目录=只重算,不 upsert) ==="
            mkdir -p /tmp/empty_fund
            uv run python scripts/load_fundamentals.py /tmp/empty_fund
            echo "=== 验证:年报与选股年份分布 ==="
            uv run python - <<'PYEOF'
            from src import db
            with db.connect(read_only=True) as conn:
                print("stock_fundamental 最近年份:")
                for y, n in conn.execute(
                    "SELECT year, COUNT(*) FROM stock_fundamental GROUP BY year ORDER BY year DESC LIMIT 4"
                ).fetchall():
                    print(f"  {y}: {n} 只")
                print("selected_stocks 逐年家数:")
                for y, n in conn.execute(
                    "SELECT year, COUNT(*) FROM selected_stocks GROUP BY year ORDER BY year"
                ).fetchall():
                    print(f"  {y}: {n} 只")
            PYEOF
            echo "=== 后台预热 ==="
            nohup uv run python deploy/warmup_redis.py > /root/warmup.log 2>&1 &
            echo "warmup pid=$!"
            free -m | head -2
