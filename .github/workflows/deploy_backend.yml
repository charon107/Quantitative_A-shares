name: 后端代码部署

# 通用后端部署（与 deploy_frontend 对偶）：任何 src/scripts/deploy 改动后手动触发。
# 遵循 bundle 推送模式——runner 打 git bundle 随 scp 推，服务器零 GitHub 出站依赖，
# update.sh 本地 fetch+merge -> 按需 uv sync -> 重启 api。
# 顺带幂等下发 SQL_API_TOKEN 到服务器 .env（只读 SQL 网关 /api/sql 的鉴权）。
on:
  workflow_dispatch: {}

concurrency:
  group: daily-ingest   # 与每日入库/其它部署互斥
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 打 git bundle 需要完整历史

      - name: 打代码 bundle
        run: |
          mkdir -p deploy_pkg
          git bundle create deploy_pkg/repo.bundle main

      - name: 传 bundle 到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "deploy_pkg/repo.bundle"
          target: "/tmp/deploy/"
          strip_components: 1

      - name: 服务器更新代码 + 重启 API
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          script: |
            set -e
            cd /root/Quantitative_A-shares/WechatNum
            export PATH="/root/.local/bin:$PATH"
            # 幂等下发 SQL 网关 token（已存在则不动；secrets 未配置则跳过）
            if [ -n "${{ secrets.SQL_API_TOKEN }}" ]; then
              touch .env
              grep -q '^SQL_API_TOKEN=' .env || echo "SQL_API_TOKEN=${{ secrets.SQL_API_TOKEN }}" >> .env
            fi
            bash deploy/update.sh /tmp/deploy/repo.bundle
            rm -rf /tmp/deploy
            sleep 2
            curl -sf http://127.0.0.1:8501/api/health && echo " <- api 健康"

      - name: 公网验收 SQL 网关（runner 侧）
        env:
          SQL_API_TOKEN: ${{ secrets.SQL_API_TOKEN }}
        run: |
          if [ -z "$SQL_API_TOKEN" ]; then echo "未配置 SQL_API_TOKEN secret，跳过"; exit 0; fi
          code=$(curl -s -o /tmp/out.arrow -D /tmp/headers.txt -w "%{http_code}" \
            -X POST "http://${{ secrets.SERVER_HOST }}:8501/api/sql" \
            -H "Authorization: Bearer $SQL_API_TOKEN" -H "Content-Type: application/json" \
            -d '{"sql":"SELECT COUNT(*) AS n FROM stock_fundamental_quarterly"}')
          echo "HTTP $code"; grep -iE "x-rows|x-truncated|content-type" /tmp/headers.txt
          [ "$code" = "200" ]
          # 无 token 必须被拒（JWT 层 401 / SQL 网关层 403，皆视为拒绝）
          denied=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "http://${{ secrets.SERVER_HOST }}:8501/api/sql" \
            -H "Content-Type: application/json" -d '{"sql":"SELECT 1"}')
          echo "无 token: HTTP $denied"; [ "$denied" = "401" ] || [ "$denied" = "403" ]
